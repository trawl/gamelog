[project]
name = "gamelog"
version = "2.1.1"
description = "A utility to keep track of board games scores"
requires-python = ">=3.12"
dependencies = [
    # 6.5 is the floor: the theme manager relies on the QStyleHints
    # color-scheme API (colorScheme / setColorScheme / colorSchemeChanged),
    # which was introduced in Qt 6.5.
    "PySide6>=6.5",
]
[project.scripts]
gamelog = "core.__main__:main"

[tool.uv]
# By default uv only rebuilds a local source tree (`uvx /path/to/gl`) when
# pyproject.toml changes, so edits to the code would keep running the stale
# cached build. Rebuild whenever any packaged source changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "core/**/*.py" },
    { file = "games/**/*.py" },
    { file = "db/**/*.py" },
    { file = "utils/**/*.py" },
    { file = "core/resources/**/*" },
]

[dependency-groups]
dev = [
    "pre-commit>=3",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "basedpyright>=1"
]

[tool.setuptools.packages.find]
include = ["core*", "games*", "db*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["core", "games"]

[tool.coverage.report]
exclude_also = [
    # CLI/dev entry points are not exercised by the test suite.
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
# Generated / vendored files are not ours to lint.
extend-exclude = ["resources_rc.py", "core/resources_rc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# Line length is enforced by the formatter, not the linter.
ignore = ["E501"]

[tool.basedpyright]
typeCheckingMode = "standard"
exclude = ["build/", ".venv/"]
