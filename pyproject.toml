[project]
name = "gamelog"
version = "2.0.0"
description = "A utility to keep track of board games scores"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
]
[project.scripts]
gamelog = "gamelog.pyw:__main__"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
# Generated / vendored files are not ours to lint.
extend-exclude = ["resources_rc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# Line length is enforced by the formatter, not the linter.
ignore = ["E501"]

[tool.basedpyright]
typeCheckingMode = "standard"
